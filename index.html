<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Rat Race</title>
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
</head>
<body>
<style>
  :root{
    --bg:#191210; --panel:#241a16; --panel-2:#2c211b;
    --wall:#e8a33d; --wall-deep:#c97f2e;
    --gold:#ffc93c; --mouse:#c9c4ce; --pink:#f2a6b8;
    --ink:#f4e9d8; --muted:#9c8b7a; --line:#3a2c23;
  }
  html,body{height:100%;}
  body{
    margin:0; background:var(--bg); color:var(--ink);
    font-family:ui-rounded,"Hiragino Maru Gothic ProN","Arial Rounded MT Bold","Segoe UI",system-ui,sans-serif;
    overscroll-behavior:none; -webkit-user-select:none; user-select:none;
    touch-action:manipulation;
    display:flex; flex-direction:column;
    height:100dvh; overflow:hidden;
  }
  header{
    display:flex; align-items:center; justify-content:space-between;
    padding:12px 16px 8px; gap:12px; flex:0 0 auto;
  }
  .logo{display:flex; align-items:baseline; gap:8px;}
  .logo h1{
    margin:0; font-size:1.25rem; font-weight:800; letter-spacing:.12em;
    text-transform:uppercase; color:var(--gold);
  }
  .logo .tail{font-size:.7rem; color:var(--muted); letter-spacing:.08em;}
  .hud{display:flex; gap:8px;}
  .chip{
    background:var(--panel); border:1px solid var(--line); border-radius:999px;
    padding:5px 12px; font-size:.78rem; font-weight:700;
    font-variant-numeric:tabular-nums; white-space:nowrap;
  }
  .chip b{color:var(--gold); font-weight:800;}
  main{flex:1 1 auto; min-height:0; display:flex; align-items:center; justify-content:center; padding:4px 10px;}
  #wrap{position:relative; width:100%; height:100%; display:flex; align-items:center; justify-content:center;}
  canvas{
    touch-action:none; border-radius:14px;
    background:radial-gradient(120% 120% at 50% 30%, #211813 0%, #171009 100%);
    box-shadow:0 0 0 1px var(--line), 0 14px 40px rgba(0,0,0,.5);
  }
  footer{
    flex:0 0 auto; text-align:center; padding:8px 16px 14px;
    font-size:.72rem; color:var(--muted); letter-spacing:.06em;
  }
  /* overlays */
  .overlay{
    position:absolute; inset:0; display:flex; align-items:center; justify-content:center;
    background:rgba(15,10,8,.78); backdrop-filter:blur(3px); border-radius:14px;
    opacity:0; pointer-events:none; transition:opacity .25s ease;
  }
  .overlay.show{opacity:1; pointer-events:auto;}
  .card{
    background:var(--panel); border:1px solid var(--line); border-radius:18px;
    padding:26px 28px; text-align:center; max-width:290px; width:82%;
    box-shadow:0 20px 60px rgba(0,0,0,.55);
  }
  .card h2{
    margin:0 0 6px; font-size:1.5rem; font-weight:800; letter-spacing:.1em;
    text-transform:uppercase; color:var(--gold); text-wrap:balance;
  }
  .card p{margin:6px 0 0; font-size:.85rem; color:var(--muted); line-height:1.5;}
  .stars{font-size:1.6rem; letter-spacing:.15em; margin:10px 0 2px; color:var(--gold);}
  .stats{
    display:flex; justify-content:center; gap:14px; margin:12px 0 4px;
    font-size:.8rem; font-variant-numeric:tabular-nums;
  }
  .stats span{color:var(--muted);}
  .stats b{color:var(--ink); font-weight:800;}
  button{
    margin-top:16px; border:0; border-radius:999px; cursor:pointer;
    background:var(--gold); color:#241a05; font:inherit; font-weight:800;
    font-size:.95rem; letter-spacing:.06em; padding:12px 30px;
    box-shadow:0 4px 0 #b8860b;
  }
  button:active{transform:translateY(3px); box-shadow:0 1px 0 #b8860b;}
  button:focus-visible{outline:3px solid var(--ink); outline-offset:3px;}
  @media (prefers-reduced-motion:reduce){
    .overlay{transition:none;}
  }
</style>

<header>
  <div class="logo"><h1>Rat Race</h1><span class="tail">🧀 or bust</span></div>
  <div class="hud">
    <span class="chip">Lv <b id="hudLevel">1</b></span>
    <span class="chip"><b id="hudMoves">0</b> swipes</span>
    <span class="chip" id="hudTime">0:00.0</span>
  </div>
</header>

<main>
  <div id="wrap">
    <canvas id="game"></canvas>
    <div class="overlay show" id="startOverlay">
      <div class="card">
        <h2>Rat Race</h2>
        <p>You're the mouse. The cheese is in the middle of the maze.<br><br>
        <b style="color:var(--ink)">Swipe</b> to scurry — you'll slide until you hit a wall. Fewer swipes, more stars.</p>
        <button id="startBtn">Let's scurry</button>
      </div>
    </div>
    <div class="overlay" id="winOverlay">
      <div class="card">
        <h2>Cheese!</h2>
        <div class="stars" id="winStars">★★★</div>
        <div class="stats">
          <span>Swipes <b id="winMoves">0</b></span>
          <span>Par <b id="winPar">0</b></span>
          <span>Time <b id="winTime">0:00.0</b></span>
        </div>
        <button id="nextBtn">Next maze</button>
      </div>
    </div>
  </div>
</main>

<footer>swipe to move · slides until a wall</footer>

<script>
(function(){
  "use strict";
  const canvas = document.getElementById('game');
  const ctx = canvas.getContext('2d');
  const DIRS = {up:[0,-1], down:[0,1], left:[-1,0], right:[1,0]};

  let level = 1, W = 9, H = 9;
  let cells = [];            // cells[y][x] = {n,s,e,w} walls (true = wall)
  let mouse = {x:0, y:0, px:0, py:0, angle:0};
  let cheese = {x:0, y:0};
  let path = [], pathT = 0;  // active slide path + progress (in cells)
  let sliding = false, winning = false, won = false, started = false;
  let queued = null;
  let swipes = 0, par = 0;
  let t0 = 0, elapsed = 0, timerOn = false;
  let trail = [];            // fading paw dots
  let confetti = [];
  let cell = 30, ox = 0, oy = 0, wallW = 4;

  const reduceMotion = matchMedia('(prefers-reduced-motion: reduce)').matches;
  const SPEED = reduceMotion ? 60 : 16; // cells per second
  let stopAtForks = false; // fallback stop rule if a maze isn't wall-slide solvable

  // ---------- maze ----------
  function genMaze(){
    cells = Array.from({length:H}, () =>
      Array.from({length:W}, () => ({n:true,s:true,e:true,w:true})));
    const seen = Array.from({length:H}, () => Array(W).fill(false));
    const stack = [[0,0]];
    seen[0][0] = true;
    while(stack.length){
      const [cx,cy] = stack[stack.length-1];
      const opts = [];
      if(cy>0   && !seen[cy-1][cx]) opts.push(['n',cx,cy-1,'s']);
      if(cy<H-1 && !seen[cy+1][cx]) opts.push(['s',cx,cy+1,'n']);
      if(cx>0   && !seen[cy][cx-1]) opts.push(['w',cx-1,cy,'e']);
      if(cx<W-1 && !seen[cy][cx+1]) opts.push(['e',cx+1,cy,'w']);
      if(!opts.length){ stack.pop(); continue; }
      const [side,nx,ny,opp] = opts[(Math.random()*opts.length)|0];
      cells[cy][cx][side] = false;
      cells[ny][nx][opp] = false;
      seen[ny][nx] = true;
      stack.push([nx,ny]);
    }
  }

  // knock a wall out of some dead ends to create loops (long satisfying slides)
  function braid(p){
    const sides = {n:[0,-1,'s'], s:[0,1,'n'], w:[-1,0,'e'], e:[1,0,'w']};
    for(let y=0;y<H;y++) for(let x=0;x<W;x++){
      const c = cells[y][x];
      const walls = ['n','s','e','w'].filter(k => c[k]);
      if(walls.length === 3 && Math.random() < p){
        const opts = walls.filter(k => {
          const [dx,dy] = sides[k];
          return x+dx>=0 && x+dx<W && y+dy>=0 && y+dy<H;
        });
        if(opts.length){
          const k = opts[(Math.random()*opts.length)|0];
          const [dx,dy,opp] = sides[k];
          c[k] = false;
          cells[y+dy][x+dx][opp] = false;
        }
      }
    }
  }

  function open(x,y,dir){
    const c = cells[y][x];
    if(dir==='up') return !c.n; if(dir==='down') return !c.s;
    if(dir==='left') return !c.w; return !c.e;
  }

  // slide from (x,y) in dir: run until wall or junction; stop early at cheese
  function slide(x,y,dir){
    const [dx,dy] = DIRS[dir];
    const p = [];
    let hitCheese = false;
    while(open(x,y,dir)){
      x += dx; y += dy;
      p.push([x,y]);
      if(x===cheese.x && y===cheese.y){ hitCheese = true; break; }
      if(stopAtForks){
        const side = (dx!==0) ? (open(x,y,'up') || open(x,y,'down'))
                              : (open(x,y,'left') || open(x,y,'right'));
        if(side) break;
      }
    }
    return {path:p, hitCheese};
  }

  // min swipes to reach cheese under slide rules (BFS over stop-cells)
  function computePar(){
    const dist = Array.from({length:H}, () => Array(W).fill(-1));
    dist[0][0] = 0;
    const q = [[0,0]];
    while(q.length){
      const [x,y] = q.shift();
      for(const dir of ['up','down','left','right']){
        const r = slide(x,y,dir);
        if(!r.path.length) continue;
        if(r.hitCheese) return dist[y][x] + 1;
        const [ex,ey] = r.path[r.path.length-1];
        if(dist[ey][ex] === -1){ dist[ey][ex] = dist[y][x]+1; q.push([ex,ey]); }
      }
    }
    return 99; // unreachable never happens in a perfect maze
  }

  // ---------- level flow ----------
  function newLevel(){
    W = H = Math.min(9 + 2*(level-1), 21);
    cheese.x = (W-1)>>1; cheese.y = (H-1)>>1;
    mouse.x = mouse.px = 0; mouse.y = mouse.py = 0; mouse.angle = 0;
    // regenerate until the maze is beatable by wall-slides at a fun par
    stopAtForks = false;
    const parMin = 4 + (level-1), parMax = parMin + 6 + level;
    let best = null, bestScore = Infinity;
    for(let tries=0; tries<200; tries++){
      genMaze();
      braid(0.5);
      par = computePar();
      if(par >= parMin && par <= parMax){ best = null; break; }
      if(par < 99){
        const score = par < parMin ? parMin - par : par - parMax;
        if(score < bestScore){ bestScore = score; best = {cells: JSON.parse(JSON.stringify(cells)), par}; }
      }
    }
    if(best){ cells = best.cells; par = best.par; }
    if(par >= 99){ stopAtForks = true; par = computePar(); }
    swipes = 0; elapsed = 0; timerOn = false;
    sliding = winning = won = false; queued = null;
    trail = []; confetti = [];
    document.getElementById('hudLevel').textContent = level;
    document.getElementById('hudMoves').textContent = 0;
    document.getElementById('hudTime').textContent = '0:00.0';
    layout();
  }

  function layout(){
    const wrap = document.getElementById('wrap');
    const avail = Math.min(wrap.clientWidth, wrap.clientHeight) - 8;
    const dpr = Math.min(window.devicePixelRatio || 1, 2);
    const pad = 10;
    cell = Math.floor((avail - pad*2) / W);
    const size = cell*W + pad*2;
    canvas.style.width = size + 'px';
    canvas.style.height = size + 'px';
    canvas.width = size*dpr; canvas.height = size*dpr;
    ctx.setTransform(dpr,0,0,dpr,0,0);
    ox = oy = pad;
    wallW = Math.max(3, Math.round(cell*0.16));
  }

  // ---------- input ----------
  function tryMove(dir){
    if(!started || won) return;
    if(sliding){ queued = dir; return; }
    const r = slide(mouse.x, mouse.y, dir);
    if(!r.path.length) return;
    if(!timerOn){ timerOn = true; t0 = performance.now() - elapsed; }
    swipes++;
    document.getElementById('hudMoves').textContent = swipes;
    path = [[mouse.x, mouse.y], ...r.path];
    pathT = 0; sliding = true; winning = r.hitCheese;
    const [dx,dy] = DIRS[dir];
    mouse.angle = Math.atan2(dy,dx);
  }

  let tx0=0, ty0=0, tActive=false;
  canvas.addEventListener('touchstart', e => {
    e.preventDefault();
    tx0 = e.touches[0].clientX; ty0 = e.touches[0].clientY; tActive = true;
  }, {passive:false});
  canvas.addEventListener('touchmove', e => {
    e.preventDefault();
    if(!tActive) return;
    const dx = e.touches[0].clientX - tx0, dy = e.touches[0].clientY - ty0;
    if(Math.hypot(dx,dy) > 26){
      tActive = false;
      tryMove(Math.abs(dx) > Math.abs(dy) ? (dx>0?'right':'left') : (dy>0?'down':'up'));
    }
  }, {passive:false});
  canvas.addEventListener('touchend', () => { tActive = false; });

  // mouse drag-swipe (desktop / side-panel play)
  let mActive = false;
  canvas.addEventListener('mousedown', e => { tx0 = e.clientX; ty0 = e.clientY; mActive = true; });
  canvas.addEventListener('mousemove', e => {
    if(!mActive) return;
    const dx = e.clientX - tx0, dy = e.clientY - ty0;
    if(Math.hypot(dx,dy) > 26){
      mActive = false;
      tryMove(Math.abs(dx) > Math.abs(dy) ? (dx>0?'right':'left') : (dy>0?'down':'up'));
    }
  });
  addEventListener('mouseup', () => { mActive = false; });

  addEventListener('keydown', e => {
    const map = {ArrowUp:'up', ArrowDown:'down', ArrowLeft:'left', ArrowRight:'right',
                 w:'up', s:'down', a:'left', d:'right'};
    if(map[e.key]){ e.preventDefault(); tryMove(map[e.key]); }
  });

  // ---------- rendering ----------
  const cx = x => ox + x*cell + cell/2;
  const cy = y => oy + y*cell + cell/2;

  function drawWalls(){
    ctx.lineCap = 'round';
    ctx.lineWidth = wallW;
    const g = ctx.createLinearGradient(0,0,0,canvas.clientHeight||canvas.height);
    g.addColorStop(0,'#e8a33d'); g.addColorStop(1,'#c97f2e');
    ctx.strokeStyle = g;
    ctx.beginPath();
    for(let y=0;y<H;y++) for(let x=0;x<W;x++){
      const c = cells[y][x];
      const L = ox+x*cell, T = oy+y*cell, R = L+cell, B = T+cell;
      if(c.n){ ctx.moveTo(L,T); ctx.lineTo(R,T); }
      if(c.w){ ctx.moveTo(L,T); ctx.lineTo(L,B); }
      if(y===H-1 && c.s){ ctx.moveTo(L,B); ctx.lineTo(R,B); }
      if(x===W-1 && c.e){ ctx.moveTo(R,T); ctx.lineTo(R,B); }
    }
    ctx.stroke();
  }

  function drawCheese(t){
    const x = cx(cheese.x), y = cy(cheese.y);
    const pulse = reduceMotion ? 1 : 1 + 0.06*Math.sin(t/300);
    const s = cell*0.36*pulse;
    ctx.save();
    ctx.translate(x,y);
    // glow
    const glow = ctx.createRadialGradient(0,0,s*0.3, 0,0,s*2.4);
    glow.addColorStop(0,'rgba(255,201,60,.32)');
    glow.addColorStop(1,'rgba(255,201,60,0)');
    ctx.fillStyle = glow;
    ctx.fillRect(-s*2.4,-s*2.4,s*4.8,s*4.8);
    // wedge
    ctx.rotate(-0.35);
    ctx.fillStyle = '#ffc93c';
    ctx.beginPath();
    ctx.moveTo(-s, s*0.75);
    ctx.lineTo(s*1.1, s*0.75);
    ctx.lineTo(s*0.15, -s);
    ctx.closePath();
    ctx.fill();
    ctx.fillStyle = '#e0a418';
    for(const [hx,hy,hr] of [[-0.25,0.35,0.16],[0.45,0.4,0.12],[0.1,-0.1,0.13]])
      { ctx.beginPath(); ctx.arc(hx*s, hy*s, hr*cell, 0, 7); ctx.fill(); }
    ctx.restore();
  }

  function drawMouse(){
    const x = cx(mouse.px), y = cy(mouse.py);
    const s = cell*0.32;
    ctx.save();
    ctx.translate(x,y);
    ctx.rotate(mouse.angle);
    // tail
    ctx.strokeStyle = '#f2a6b8'; ctx.lineWidth = Math.max(1.5, cell*0.06); ctx.lineCap='round';
    ctx.beginPath();
    ctx.moveTo(-s*0.9, 0);
    ctx.quadraticCurveTo(-s*1.8, s*0.5, -s*2.1, -s*0.15);
    ctx.stroke();
    // body
    ctx.fillStyle = '#c9c4ce';
    ctx.beginPath(); ctx.ellipse(0,0, s*1.05, s*0.78, 0, 0, 7); ctx.fill();
    // ears
    ctx.beginPath(); ctx.arc(s*0.25,-s*0.72, s*0.42, 0, 7); ctx.fill();
    ctx.beginPath(); ctx.arc(s*0.25, s*0.72, s*0.42, 0, 7); ctx.fill();
    ctx.fillStyle = '#f2a6b8';
    ctx.beginPath(); ctx.arc(s*0.25,-s*0.72, s*0.24, 0, 7); ctx.fill();
    ctx.beginPath(); ctx.arc(s*0.25, s*0.72, s*0.24, 0, 7); ctx.fill();
    // nose + eye
    ctx.beginPath(); ctx.arc(s*1.05, 0, s*0.16, 0, 7); ctx.fill();
    ctx.fillStyle = '#241a16';
    ctx.beginPath(); ctx.arc(s*0.55,-s*0.28, s*0.11, 0, 7); ctx.fill();
    ctx.beginPath(); ctx.arc(s*0.55, s*0.28, s*0.11, 0, 7); ctx.fill();
    ctx.restore();
  }

  function fmt(ms){
    const s = ms/1000;
    return (s/60|0) + ':' + String((s%60)|0).padStart(2,'0') + '.' + ((s*10)%10|0);
  }

  function burst(){
    const x = cx(cheese.x), y = cy(cheese.y);
    for(let i=0;i<40;i++){
      const a = Math.random()*Math.PI*2, v = 1.5+Math.random()*3.5;
      confetti.push({x, y, vx:Math.cos(a)*v, vy:Math.sin(a)*v-1.5,
        life:1, col:['#ffc93c','#e8a33d','#f2a6b8','#f4e9d8'][(Math.random()*4)|0]});
    }
    if(navigator.vibrate) navigator.vibrate(40);
  }

  function winLevel(){
    won = true; timerOn = false;
    burst();
    const stars = swipes <= par ? 3 : swipes <= par+2 ? 2 : 1;
    document.getElementById('winStars').textContent = '★'.repeat(stars) + '☆'.repeat(3-stars);
    document.getElementById('winMoves').textContent = swipes;
    document.getElementById('winPar').textContent = par;
    document.getElementById('winTime').textContent = fmt(elapsed);
    setTimeout(() => document.getElementById('winOverlay').classList.add('show'),
      reduceMotion ? 0 : 550);
  }

  // rAF pauses in hidden tabs; fall back to setTimeout so game state still settles
  const raf = cb => document.hidden ? setTimeout(() => cb(performance.now()), 16)
                                    : requestAnimationFrame(cb);

  let last = performance.now();
  function frame(now){
    const dt = Math.min((now-last)/1000, 0.05); last = now;

    if(timerOn){
      elapsed = now - t0;
      document.getElementById('hudTime').textContent = fmt(elapsed);
    }

    if(sliding){
      pathT += SPEED*dt;
      const maxT = path.length-1;
      if(pathT >= maxT){
        pathT = maxT; sliding = false;
        const [ex,ey] = path[maxT];
        mouse.x = mouse.px = ex; mouse.y = mouse.py = ey;
        if(winning) winLevel();
        else if(queued){ const d = queued; queued = null; tryMove(d); }
      } else {
        const i = pathT|0, f = pathT-i;
        const [x1,y1] = path[i], [x2,y2] = path[i+1];
        mouse.px = x1+(x2-x1)*f; mouse.py = y1+(y2-y1)*f;
        if(trail.length===0 || Math.hypot(mouse.px-trail[trail.length-1].x, mouse.py-trail[trail.length-1].y) > 0.6)
          trail.push({x:mouse.px, y:mouse.py, life:1});
      }
    }

    // draw
    const size = canvas.clientWidth;
    ctx.clearRect(0,0,size,size);

    // floor dots
    ctx.fillStyle = 'rgba(244,233,216,.05)';
    for(let y=0;y<H;y++) for(let x=0;x<W;x++)
      { ctx.beginPath(); ctx.arc(cx(x), cy(y), 1.2, 0, 7); ctx.fill(); }

    // trail
    for(const p of trail){
      p.life -= dt*0.9;
      if(p.life>0){
        ctx.fillStyle = 'rgba(201,196,206,'+(p.life*0.25)+')';
        ctx.beginPath(); ctx.arc(cx(p.x), cy(p.y), cell*0.09, 0, 7); ctx.fill();
      }
    }
    trail = trail.filter(p => p.life>0);

    drawWalls();
    if(!won || confetti.length) drawCheese(now);
    drawMouse();

    // confetti
    for(const c of confetti){
      c.x += c.vx; c.y += c.vy; c.vy += 0.12; c.life -= dt*1.1;
      if(c.life>0){
        ctx.globalAlpha = Math.max(c.life,0);
        ctx.fillStyle = c.col;
        ctx.fillRect(c.x-2, c.y-2, 4, 4);
        ctx.globalAlpha = 1;
      }
    }
    confetti = confetti.filter(c => c.life>0);

    raf(frame);
  }

  // ---------- boot ----------
  document.getElementById('startBtn').addEventListener('click', () => {
    document.getElementById('startOverlay').classList.remove('show');
    started = true;
  });
  document.getElementById('nextBtn').addEventListener('click', () => {
    document.getElementById('winOverlay').classList.remove('show');
    level++;
    newLevel();
  });
  addEventListener('resize', layout);

  newLevel();
  raf(frame);

  // tiny debug hook for automated testing
  window.__RR = {
    move: tryMove, open,
    state: () => ({mouse:{x:mouse.x,y:mouse.y}, cheese:{...cheese}, W, H, level, swipes, par, sliding, won, stopAtForks})
  };
})();
</script>
</body>
</html>
